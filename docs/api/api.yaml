        latitude: 37.386
        longitude: -122.084

    Meta:
      type: object
      required: [page, size, total]
      properties:
        page:
          type: integer
          description: Current page number (1-indexed)
        size:
          type: integer
          description: Number of items per page
        total:
          type: integer
          description: Total number of items across all pages
      example:
        page: 1
        size: 20
        total: 1
